<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Planechase Controller</title>

  <style>
    :root{
      --bg: #0b0f14;
      --card: rgba(255,255,255,0.06);
      --card2: rgba(255,255,255,0.08);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.65);
      --border: rgba(255,255,255,0.10);
      --shadow: 0 12px 40px rgba(0,0,0,0.45);
      --radius: 18px;

      --accent: #7dd3fc;   /* light cyan */
      --accent2: #a78bfa;  /* soft purple */
      --danger: #fb7185;   /* pink-red */
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin: 0;
      background: radial-gradient(1200px 900px at 10% 0%, rgba(125,211,252,0.20), transparent 55%),
                  radial-gradient(1200px 900px at 90% 10%, rgba(167,139,250,0.18), transparent 55%),
                  var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      /* iPhone safe areas */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .wrap{
      min-height: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px;
    }

    header{
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 16px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.04));
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .title{
      display: flex;
      flex-direction: column;
      gap: 4px;
      line-height: 1.1;
    }
    .title h1{
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .title .sub{
      font-size: 12px;
      color: var(--muted);
    }

    .pill{
      font-variant-numeric: tabular-nums;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.25);
      color: var(--text);
      min-width: 112px;
      text-align: center;
    }
    .pill .big{
      font-size: 14px;
      font-weight: 700;
      display: block;
    }
    .pill .small{
      font-size: 11px;
      color: var(--muted);
      display: block;
      margin-top: 2px;
    }

    .panel{
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      backdrop-filter: blur(10px);
    }

    .grid{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button{
      appearance: none;
      border: 1px solid rgba(255,255,255,0.14);
      background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.05));
      color: var(--text);
      border-radius: 16px;
      padding: 18px 14px;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
      transition: transform 0.05s ease, filter 0.15s ease, border-color 0.15s ease;
      width: 100%;
      min-height: 64px; /* thumb-friendly */
      touch-action: manipulation;
    }

    button:active{
      transform: translateY(1px) scale(0.99);
      filter: brightness(1.05);
    }

    .btn-primary{
      border-color: rgba(125,211,252,0.35);
      background: linear-gradient(180deg, rgba(125,211,252,0.22), rgba(255,255,255,0.06));
    }

    .btn-secondary{
      border-color: rgba(167,139,250,0.35);
      background: linear-gradient(180deg, rgba(167,139,250,0.20), rgba(255,255,255,0.06));
    }

    .btn-danger{
      border-color: rgba(251,113,133,0.45);
      background: linear-gradient(180deg, rgba(251,113,133,0.20), rgba(255,255,255,0.06));
    }

    .row{
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .row button{
      min-height: 58px;
      font-size: 16px;
      font-weight: 700;
      padding: 14px 12px;
    }

    .hint{
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .statusline{
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Landscape: make buttons wider and reduce vertical padding */
    @media (orientation: landscape){
      .wrap{ padding: 12px; gap: 10px; }
      header{ padding: 12px; }
      button{ min-height: 58px; padding: 14px 12px; }
      .panel{ padding: 12px; }
      .title h1{ font-size: 17px; }
    }
    /* === Primary navigation buttons === */

.main-controls{
  gap: 16px;
}

.btn-nav{
  min-height: 150px;          /* BIG tap target */
  font-size: 60px;
  font-weight: 800;
  letter-spacing: 3px;

  border-radius: 22px;
  border-width: 2px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height:1.5;

  box-shadow:
    0 18px 40px rgba(0,0,0,0.55),
    inset 0 0 0 1px rgba(255,255,255,0.12);
}

.btn-nav span{
  font-size: 30px;
}

/* PREV — cooler tone */
.btn-prev{
  border-color: rgba(167,139,250,0.7);
  background: linear-gradient(
    180deg,
    rgba(167,139,250,0.40),
    rgba(255,255,255,0.10)
  );
}

/* NEXT — brightest + most prominent */
.btn-next{
  border-color: rgba(125,211,252,0.9);
  background: linear-gradient(
    180deg,
    rgba(125,211,252,0.55),
    rgba(255,255,255,0.12)
  );
}

/* Stronger press feedback */
.btn-nav:active{
  transform: translateY(2px) scale(0.985);
  filter: brightness(1.15);
}

/* Landscape tweaks */
@media (orientation: landscape){
  .btn-nav{
    min-height: 90px;
    font-size: 24px;
  }
      .btn-nav span{
        font-size: 26px;
      }
    }

    .sources-wrap {
      position: relative;
    }

    .sources-panel {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.35);
      padding: 10px;
      display: none;
    }

    .sources-panel.open {
      display: block;
    }

    .sources-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .sources-actions button {
      min-height: 44px;
      font-size: 13px;
      padding: 8px 10px;
    }

    .source-list {
      max-height: 220px;
      overflow: auto;
      display: grid;
      gap: 6px;
      padding-right: 4px;
    }

    .source-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text);
    }

    .source-item input {
      width: 18px;
      height: 18px;
    }

  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="title">
        <h1>Planechase Controller</h1>
      </div>
      
      <div class="pill" id="pill">
        <span class="small" id="pos">—</span>
        <span class="small" id="room">room: my-room</span>
      </div>
    </header>

    <div class="panel">
      <div class="grid main-controls">
        <button class="btn-nav btn-prev" id="prev" aria-label="Previous card">
          <span>PREV</span>◀
        </button>

        <button class="btn-nav btn-next" id="next" aria-label="Next card">
          <span>NEXT<br>▶
        </button>
      </div>

      <div class="row">
        <button class="btn-danger" id="reset" aria-label="Reset to first card">⟲ Reset</button>
        <button id="fs">⛶ Fullscreen</button>
        <button id="reshuffle" aria-label="Reshuffle order">🔀 Reshuffle</button>
      </div>
      <div class="row">
        <button id="toggleText" aria-label="Toggle clear text overlay">Text: Off</button>
        <button id="sourcesBtn" aria-label="Show source filters">Sources</button>
      </div>
      <div class="sources-wrap">
        <div class="sources-panel" id="sourcesPanel">
          <div class="sources-actions">
            <button id="sourcesAll" type="button">All</button>
            <button id="sourcesNone" type="button">None</button>
          </div>
          <div class="source-list" id="sourceList"></div>
        </div>
      </div>

      <!-- <div class="hint">
        Tip: If you rotate your phone, the layout adapts. Reset goes to the start of the current shuffled order.
        Reshuffle asks the display session to reshuffle (it clears <code>order</code> and sets <code>idx</code> to 0).
      </div> -->

      <div class="statusline">
        <span id="status">Status: ready</span>
        <span id="net"></span>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, doc, runTransaction, onSnapshot } from "./common.js";

    const roomId = "my-room";
    const roomRef = doc(db, "rooms", roomId);

    const statusEl = document.getElementById("status");
    const posEl = document.getElementById("pos");
    const netEl = document.getElementById("net");
    const textBtn = document.getElementById("toggleText");
    const sourcesBtn = document.getElementById("sourcesBtn");
    const sourcesPanel = document.getElementById("sourcesPanel");
    const sourceListEl = document.getElementById("sourceList");
    const sourcesAllBtn = document.getElementById("sourcesAll");
    const sourcesNoneBtn = document.getElementById("sourcesNone");
    document.getElementById("room").textContent = "room: " + roomId;

    let allSources = [];
    let currentSelectedSources = [];
    let ignoreCheckboxSync = false;

    function setStatus(text) {
      statusEl.textContent = "Status: " + text;
    }

    async function loadAllSources() {
      const res = await fetch("./deck.json", { cache: "no-store" });
      if (!res.ok) throw new Error("Failed to load deck.json");
      const raw = await res.json();
      const cards = Array.isArray(raw) ? raw : (Array.isArray(raw.deck) ? raw.deck : []);

      const unique = new Set();
      for (const card of cards) {
        if (typeof card?.source === "string" && card.source.trim()) {
          unique.add(card.source.trim());
        }
      }
      return Array.from(unique).sort((a, b) => a.localeCompare(b));
    }

    function renderSourceList() {
      sourceListEl.innerHTML = "";
      for (const src of allSources) {
        const label = document.createElement("label");
        label.className = "source-item";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = src;
        cb.checked = currentSelectedSources.includes(src);
        cb.addEventListener("change", onSourceSelectionChanged);

        const text = document.createElement("span");
        text.textContent = src;

        label.appendChild(cb);
        label.appendChild(text);
        sourceListEl.appendChild(label);
      }
    }

    function syncSourceChecksFromState() {
      ignoreCheckboxSync = true;
      const set = new Set(currentSelectedSources);
      for (const cb of sourceListEl.querySelectorAll('input[type="checkbox"]')) {
        cb.checked = set.has(cb.value);
      }
      ignoreCheckboxSync = false;
    }

    function readSelectedSourcesFromUI() {
      const selected = [];
      for (const cb of sourceListEl.querySelectorAll('input[type="checkbox"]')) {
        if (cb.checked) selected.push(cb.value);
      }
      return selected;
    }

    async function setSelectedSources(selectedSources) {
      const normalized = allSources.filter((src) => selectedSources.includes(src));
      currentSelectedSources = normalized;
      syncSourceChecksFromState();

      setStatus("updating sources...");
      try {
        await runTransaction(db, async (tx) => {
          const snap = await tx.get(roomRef);
          if (!snap.exists()) return;
          tx.set(roomRef, { selectedSources: normalized }, { merge: true });
        });
        setStatus("synced");
      } catch (e) {
        setStatus("error: " + e.message);
      }
    }

    async function onSourceSelectionChanged() {
      if (ignoreCheckboxSync) return;
      await setSelectedSources(readSelectedSourcesFromUI());
    }

    async function toggleShowText() {
      setStatus("updating text toggle...");
      try {
        await runTransaction(db, async (tx) => {
          const snap = await tx.get(roomRef);
          if (!snap.exists()) return;
          const data = snap.data();
          const current = !!data.showText;
          tx.set(roomRef, { showText: !current }, { merge: true });
        });
        setStatus("synced");
      } catch (e) {
        setStatus("error: " + e.message);
      }
    }

    function updateOnlineStatus(){
      netEl.textContent = navigator.onLine ? "Online" : "Offline";
    }
    window.addEventListener("online", updateOnlineStatus);
    window.addEventListener("offline", updateOnlineStatus);
    updateOnlineStatus();


const fsBtn = document.getElementById("fs");

async function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();

      // Optional: lock orientation (may fail silently)
      if (screen.orientation && screen.orientation.lock) {
        try {
          await screen.orientation.lock(screen.orientation.type);
        } catch (_) {}
      }

      fsBtn.textContent = "⛶ Exit Fullscreen";
    } else {
      await document.exitFullscreen();
      fsBtn.textContent = "⛶ Fullscreen";
    }
  } catch (e) {
    console.warn("Fullscreen toggle failed:", e);
  }
}

fsBtn.addEventListener("click", toggleFullscreen);

// Keep button label in sync if user exits via gesture
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) {
    fsBtn.textContent = "⛶ Fullscreen";
  }
});


    // Live position pill (idx / order length)
    onSnapshot(roomRef, (snap) => {
      if (!snap.exists()) {
        posEl.textContent = "—";
        setStatus("room not found");
        return;
      }
      const data = snap.data();
      const idx = typeof data.idx === "number" ? data.idx : 0;
      const order = Array.isArray(data.order) ? data.order : [];
      if (order.length > 0) {
        posEl.textContent = (idx) + " / " + order.length;
      } else {
        posEl.textContent = (idx) + " / ?";
      }

      const showText = !!data.showText;
      textBtn.textContent = "Text: " + (showText ? "On" : "Off");

      const selectedFromDoc = Array.isArray(data.selectedSources) ? data.selectedSources : allSources;
      currentSelectedSources = allSources.filter((src) => selectedFromDoc.includes(src));
      syncSourceChecksFromState();

      setStatus("synced");
    }, (err) => {
      setStatus(err.message);
    });

    async function step(delta) {
      setStatus("sending…");
      try {
        await runTransaction(db, async (tx) => {
          const snap = await tx.get(roomRef);
          if (!snap.exists()) return;

          const data = snap.data();
          const order = Array.isArray(data.order) ? data.order : [];
          const min = -1;
          const max = Math.max(0, order.length - 1);
          const idx = typeof data.idx === "number" ? data.idx : 0;

          const nextIdx = Math.min(max, Math.max(min, idx + delta));
          tx.set(roomRef, { idx: nextIdx }, { merge: true });
        });
        setStatus("synced");
      } catch (e) {
        setStatus("error: " + e.message);
      }
    }

    async function reset() {
      setStatus("resetting…");
      try {
        await runTransaction(db, async (tx) => {
          const snap = await tx.get(roomRef);
          if (!snap.exists()) return;
          tx.set(roomRef, { idx: -1 }, { merge: true });
        });
        setStatus("synced");
      } catch (e) {
        setStatus("error: " + e.message);
      }
    }

    // This asks the display side to reshuffle by clearing the order.
    // Your display page already has logic to regenerate order when it sees mismatch/empty.
    async function reshuffle() {
      setStatus("reshuffling…");
      try {
        await runTransaction(db, async (tx) => {
          const snap = await tx.get(roomRef);
          if (!snap.exists()) return;
          tx.set(roomRef, { order: [], idx: 0, forceReloadAt: Date.now() }, { merge: true });
        });
        setStatus("synced");
      } catch (e) {
        setStatus("error: " + e.message);
      }
    }

    // Big buttons
    document.getElementById("prev").addEventListener("click", () => step(-1));
    document.getElementById("next").addEventListener("click", () => step(1));
    document.getElementById("reset").addEventListener("click", () => reset());
    document.getElementById("reshuffle").addEventListener("click", () => reshuffle());
    textBtn.addEventListener("click", toggleShowText);

    sourcesBtn.addEventListener("click", () => {
      sourcesPanel.classList.toggle("open");
    });
    sourcesAllBtn.addEventListener("click", async () => {
      await setSelectedSources(allSources.slice());
    });
    sourcesNoneBtn.addEventListener("click", async () => {
      await setSelectedSources([]);
    });

    // Optional: hardware keyboard support (nice on desktop)
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
      if (e.key === "Home") reset();
    });

    try {
      allSources = await loadAllSources();
      currentSelectedSources = allSources.slice();
      renderSourceList();
    } catch (e) {
      setStatus("source load error: " + e.message);
    }
  </script>
</body>
</html>
