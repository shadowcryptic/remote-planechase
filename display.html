<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planechase Display</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
      }

      .stage {
        position: relative;
        z-index: 5;
      }

      .stage::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 530px;
        height: 730px;
        transform: translate(-50%, -50%) rotate(90deg) scale(0.98);
        border-radius: 22px;
        border: 2px solid rgba(255, 110, 110, 0.5);
        box-shadow:
          0 0 20px rgba(255, 72, 72, 0.4),
          0 0 48px rgba(170, 16, 16, 0.35);
        opacity: 0;
        pointer-events: none;
        z-index: 8;
      }

      body.phenomenon-active .stage::after {
        animation: phenomenonRingPulse 1600ms linear infinite;
      }

      .deck {
        width: 680px;
        height: 488px;
        position: relative;
        transition: opacity 220ms ease, filter 220ms ease;
      }

      .card {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(90deg);
        max-width: 488px;
        max-height: 680px;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 14px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
        user-select: none;
        -webkit-user-drag: none;
        will-change: transform;
      }

      .top {
        z-index: 2;
        transform: translate(-50%, -50%) rotate(90deg) translateX(0) translateZ(0);
      }

      .under {
        z-index: 1;
        transform: translate(-50%, -50%) rotate(90deg) translateX(0) translateZ(0px);
      }

      .top.to-right {
        transition: transform 760ms cubic-bezier(0.2, 0.8, 0.2, 1);
        transform: translate(-50%, -50%) rotate(90deg) translateX(500px) translateZ(0);
      }

      .under.park-right {
        transition: none !important;
        transform: translate(-50%, -50%) rotate(90deg) translateX(500px) translateZ(0px);
      }

      .under.return-center {
        transition: transform 1320ms cubic-bezier(0.2, 0.8, 0.2, 1);
        transform: translate(-50%, -50%) rotate(90deg) translateX(0) translateZ(0px);
      }

      .under.under-to-right {
        transition: transform 760ms cubic-bezier(0.2, 0.8, 0.2, 1);
        transform: translate(-50%, -50%) rotate(90deg) translateX(500px) translateZ(0px);
      }

      .top.park-right-top {
        transition: none !important;
        z-index: 3;
        transform: translate(-50%, -50%) rotate(90deg) translateX(500px) translateZ(0);
      }

      .top.return-center-top {
        transition: transform 820ms cubic-bezier(0.2, 0.8, 0.2, 1);
        z-index: 3;
        transform: translate(-50%, -50%) rotate(90deg) translateX(0) translateZ(0);
      }

      .text-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        border-radius: 16px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 220ms ease;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }

      .text-card {
        width: min(560px, 92%);
        max-height: 86%;
        overflow: auto;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.84);
        box-shadow: 0 16px 42px rgba(0, 0, 0, 0.55);
        color: rgba(255, 255, 255, 0.96);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.45;
        padding: 14px 16px;
      }

      .text-title {
        margin: 0 0 6px;
        font-size: 26px;
        font-weight: 700;
      }

      .text-type {
        margin: 0 0 10px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.72);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .text-block {
        margin: 0 0 12px;
        font-size: 18px;
        white-space: pre-line;
      }

      .symbol-icon {
        width: 1.05em;
        height: 1.05em;
        vertical-align: -0.12em;
        object-fit: contain;
      }

      .text-label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.68);
        margin-bottom: 4px;
      }

      .phenomenon-flash {
        position: fixed;
        inset: 0;
        z-index: 12;
        pointer-events: none;
        opacity: 0;
        background:
          radial-gradient(
            circle at center,
            rgba(255, 245, 245, 0.4) 0%,
            rgba(255, 95, 95, 0.24) 35%,
            rgba(145, 18, 18, 0.2) 60%,
            rgba(0, 0, 0, 0) 78%
          );
      }

      .phenomenon-flash.active {
        animation: phenomenonPulse 2200ms linear;
      }

      .phenomenon-particles-back,
      .phenomenon-particles-front {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
      }

      .phenomenon-particles-back {
        z-index: 3;
        background:
          radial-gradient(circle at 50% 50%, rgba(255, 70, 70, 0.3) 0 2px, transparent 3px),
          radial-gradient(circle at 50% 50%, rgba(255, 125, 125, 0.24) 0 1.5px, transparent 2.5px);
        background-size: 90px 90px, 62px 62px;
        filter: blur(0.7px);
      }

      .phenomenon-particles-front {
        z-index: 9;
        background:
          radial-gradient(circle at 50% 50%, rgba(255, 235, 235, 0.97) 0 2.2px, transparent 3.4px),
          radial-gradient(circle at 50% 50%, rgba(255, 105, 105, 0.84) 0 1.4px, transparent 2.3px);
        background-size: 72px 72px, 54px 54px;
      }

      .phenomenon-particles-back.active {
        animation: phenomenonParticlesBack 2800ms linear;
      }

      .phenomenon-particles-front.active {
        animation: phenomenonParticlesFront 2000ms linear;
      }

      @keyframes phenomenonPulse {
        0% {
          opacity: 0;
          transform: scale(0.88);
        }
        18% {
          opacity: 0.95;
          transform: scale(0.95);
        }
        58% {
          opacity: 0.55;
          transform: scale(1.03);
        }
        100% {
          opacity: 0;
          transform: scale(1.12);
        }
      }

      @keyframes phenomenonParticlesFront {
        0% {
          opacity: 0;
          transform: scale(0.24) rotate(0deg);
          filter: blur(0px);
        }
        16% {
          opacity: 0.96;
          transform: scale(0.56) rotate(4deg);
          filter: blur(0px);
        }
        55% {
          opacity: 0.54;
          transform: scale(1.04) rotate(11deg);
          filter: blur(0.4px);
        }
        100% {
          opacity: 0;
          transform: scale(1.55) rotate(18deg);
          filter: blur(1px);
        }
      }

      @keyframes phenomenonParticlesBack {
        0% {
          opacity: 0;
          transform: scale(0.34) rotate(0deg);
        }
        18% {
          opacity: 0.72;
          transform: scale(0.78) rotate(-3deg);
        }
        62% {
          opacity: 0.4;
          transform: scale(1.48) rotate(-8deg);
        }
        100% {
          opacity: 0;
          transform: scale(2.2) rotate(-12deg);
        }
      }

      @keyframes phenomenonRingPulse {
        0% {
          opacity: 0.24;
          transform: translate(-50%, -50%) rotate(90deg) scale(0.97);
        }
        45% {
          opacity: 0.72;
          transform: translate(-50%, -50%) rotate(90deg) scale(1.02);
        }
        100% {
          opacity: 0.24;
          transform: translate(-50%, -50%) rotate(90deg) scale(0.97);
        }
      }

      body.text-mode .deck {
        opacity: 0.25;
        filter: brightness(0.55) blur(1.6px);
      }

      body.text-mode .text-overlay {
        opacity: 1;
      }

      #status {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 9999;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.8);
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 8px 10px;
      }

      @media (prefers-reduced-motion: reduce) {
        .top.to-right,
        .under.return-center,
        .under.under-to-right,
        .top.return-center-top {
          transition: none !important;
        }

        .phenomenon-flash.active,
        .phenomenon-particles-back.active,
        .phenomenon-particles-front.active {
          animation: none !important;
          opacity: 0;
        }

        body.phenomenon-active .stage::after {
          animation: none !important;
          opacity: 0.32;
        }
      }
    </style>
  </head>

  <body>
    <div id="status">Booting…</div>
    <div id="phenomenonParticlesBack" class="phenomenon-particles-back" aria-hidden="true"></div>
    <div id="phenomenonFlash" class="phenomenon-flash" aria-hidden="true"></div>
    <div id="phenomenonParticlesFront" class="phenomenon-particles-front" aria-hidden="true"></div>

    <div class="stage">
      <div class="deck">
        <img id="cardUnder" class="card under" alt="" />
        <img id="cardTop" class="card top" alt="" />
      </div>
      <div id="textOverlay" class="text-overlay" aria-live="polite" aria-atomic="true">
        <div class="text-card">
          <h2 id="textName" class="text-title">No card</h2>
          <div id="textType" class="text-type"></div>
          <div class="text-label">Main Effect</div>
          <div id="textMain" class="text-block">-</div>
          <div class="text-label">Chaos Effect</div>
          <div id="textChaos" class="text-block">-</div>
        </div>
      </div>
    </div>

    <script type="module">
      import {
        db,
        doc,
        onSnapshot,
        runTransaction,
        serverTimestamp,
      } from "./common.js";

      const statusEl = document.getElementById("status");
      const roomRef = doc(db, "rooms", "my-room");

      const topImg = document.getElementById("cardTop");
      const underImg = document.getElementById("cardUnder");
      const textNameEl = document.getElementById("textName");
      const textTypeEl = document.getElementById("textType");
      const textMainEl = document.getElementById("textMain");
      const textChaosEl = document.getElementById("textChaos");
      const phenomenonParticlesBackEl = document.getElementById("phenomenonParticlesBack");
      const phenomenonFlashEl = document.getElementById("phenomenonFlash");
      const phenomenonParticlesFrontEl = document.getElementById("phenomenonParticlesFront");

      let lastForceReloadAt = undefined;
      const BACK_URL =
        "https://backs.scryfall.io/large/7/8/7840c131-f96b-4700-9347-2215c43156e6.jpg";
      let allCards = [];
      let filteredCards = [];
      let deckUrls = [];
      let activeFilterSig = "";
      let currentUrl = "";
      let animating = false;
      let lastIdx = null;
      let repairInFlight = false;
      let lastShownOracleId = "";

      // Fill these URLs with your icon image paths.
      const SYMBOL_ICONS = {
        T: "https://static.wikia.nocookie.net/mtgsalvation_gamepedia/images/b/be/T.svg",
        X: "https://static.wikia.nocookie.net/mtgsalvation_gamepedia/images/3/3f/X.svg",
        C: "https://static.wikia.nocookie.net/mtgsalvation_gamepedia/images/1/1a/C.svg",
        W: "https://static.wikia.nocookie.net/mtgsalvation_gamepedia/images/8/8e/W.svg",
        U: "https://static.wikia.nocookie.net/mtgsalvation_gamepedia/images/9/9f/U.svg",
        B: "https://static.wikia.nocookie.net/mtgsalvation_gamepedia/images/2/2f/B.svg",
        R: "https://static.wikia.nocookie.net/mtgsalvation_gamepedia/images/8/87/R.svg",
        G: "https://static.wikia.nocookie.net/mtgsalvation_gamepedia/images/8/88/G.svg",
        1: "https://static.wikia.nocookie.net/mtgsalvation_gamepedia/images/9/96/1.svg",
        2: "https://static.wikia.nocookie.net/mtgsalvation_gamepedia/images/4/4d/2.svg",
        3: "https://static.wikia.nocookie.net/mtgsalvation_gamepedia/images/8/8c/3.svg",
        4: "https://static.wikia.nocookie.net/mtgsalvation_gamepedia/images/b/bf/4.svg"
      };

      function setStatus(text) {
        statusEl.textContent = text;
      }

      async function loadDeck() {
        const res = await fetch("./deck.json", { cache: "no-store" });
        if (!res.ok) throw new Error("Failed to load deck.json");
        const data = await res.json();
        return Array.isArray(data) ? data : Array.isArray(data.deck) ? data.deck : [];
      }

      function isPlane(card) {
        const type = typeof card?.plane_type === "string" ? card.plane_type : "";
        return type.toLowerCase() === "plane";
      }

      function buildFilterSig(selectedSources) {
        const sorted = [...selectedSources].sort((a, b) => a.localeCompare(b));
        return JSON.stringify(sorted);
      }

      function getFilteredCards(selectedSources) {
        const planes = allCards;
        if (!Array.isArray(selectedSources)) return planes;
        if (selectedSources.length === 0) return [];
        const allowed = new Set(selectedSources);
        return planes.filter((card) => allowed.has(card.source));
      }

      function renderTextCard(card) {
        if (!card) {
          textNameEl.textContent = "No card";
          textTypeEl.textContent = "";
          textMainEl.innerHTML = "-";
          textChaosEl.innerHTML = "-";
          return;
        }
        textNameEl.textContent = card.name || "Unnamed";
        textTypeEl.textContent = card.plane_type || "Plane";
        textMainEl.innerHTML = formatRulesTextWithSymbols(card.main_effect || "-");
        textChaosEl.innerHTML = formatRulesTextWithSymbols(card.chaos_effect || "-");
      }

      function escapeHtml(text) {
        return String(text)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function formatRulesTextWithSymbols(text) {
        const escaped = escapeHtml(text).replace(/\r?\n/g, "<br>");
        return escaped.replace(/\{(T|R|U|B|G|1|2|3|4|5)\}/g, (match, symbol) => {
          const src = SYMBOL_ICONS[symbol];
          if (!src) return match;
          return `<img class="symbol-icon" src="${escapeHtml(src)}" alt="{${symbol}}" />`;
        });
      }

      function applyFilteredCards(selectedSources) {
        const normalizedSources = Array.isArray(selectedSources) ? selectedSources : null;
        const sig = normalizedSources === null ? "__ALL__" : buildFilterSig(normalizedSources);
        if (sig === activeFilterSig) return false;

        activeFilterSig = sig;
        filteredCards = getFilteredCards(normalizedSources);
        deckUrls = filteredCards.map((card) => card.image).filter(Boolean);
        currentUrl = "";
        lastIdx = null;
        lastShownOracleId = "";
        setPhenomenonActive(false);
        clearCards();
        renderTextCard(null);
        setStatus("Deck loaded: " + deckUrls.length + " cards");
        return true;
      }

      function applyTextMode(enabled) {
        document.body.classList.toggle("text-mode", !!enabled);
      }

      function setPhenomenonActive(enabled) {
        document.body.classList.toggle("phenomenon-active", !!enabled);
      }

      function isPhenomenon(card) {
        const type = typeof card?.plane_type === "string" ? card.plane_type : "";
        return type.toLowerCase() === "phenomenon";
      }

      function triggerPhenomenonEffect() {
        if (!phenomenonFlashEl) return;
        if (phenomenonParticlesBackEl) {
          phenomenonParticlesBackEl.classList.remove("active");
          void phenomenonParticlesBackEl.offsetWidth;
          phenomenonParticlesBackEl.classList.add("active");
        }
        phenomenonFlashEl.classList.remove("active");
        void phenomenonFlashEl.offsetWidth;
        phenomenonFlashEl.classList.add("active");
        if (phenomenonParticlesFrontEl) {
          phenomenonParticlesFrontEl.classList.remove("active");
          void phenomenonParticlesFrontEl.offsetWidth;
          phenomenonParticlesFrontEl.classList.add("active");
        }
      }

      function shuffledIndices(n) {
        const a = [];
        for (let i = 0; i < n; i++) a.push(i);
        for (let i = n - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = a[i];
          a[i] = a[j];
          a[j] = tmp;
        }
        return a;
      }

      async function ensureOrderMatchesDeck() {
        if (!deckUrls.length || repairInFlight) return;
        repairInFlight = true;
        try {
          await runTransaction(db, async (tx) => {
            const snap = await tx.get(roomRef);
            const existing = snap.exists() ? snap.data() : {};
            const order = Array.isArray(existing.order) ? existing.order : [];
            const existingFilterSig =
              typeof existing.deckFilterSig === "string" ? existing.deckFilterSig : "";

            if (order.length !== deckUrls.length || existingFilterSig !== activeFilterSig) {
              tx.set(
                roomRef,
                {
                  order: shuffledIndices(deckUrls.length),
                  idx: -1,
                  deckFilterSig: activeFilterSig,
                  shuffledAt: serverTimestamp(),
                },
                { merge: true },
              );
            }
          });
        } finally {
          repairInFlight = false;
        }
      }

      function parseTimeListToMs(listStr) {
        const parts = listStr.split(",").map((s) => s.trim());
        return parts.map((p) => {
          if (p.endsWith("ms")) return Number(p.slice(0, -2));
          if (p.endsWith("s")) return Number(p.slice(0, -1)) * 1000;
          return Number(p) || 0;
        });
      }

      function waitTransition(el) {
        return new Promise((resolve) => {
          const cs = getComputedStyle(el);
          const durations = parseTimeListToMs(cs.transitionDuration);
          const delays = parseTimeListToMs(cs.transitionDelay);
          const n = Math.max(durations.length, delays.length, 1);
          let maxTotal = 0;
          for (let i = 0; i < n; i++) {
            const d = durations[i] ?? durations[durations.length - 1] ?? 0;
            const l = delays[i] ?? delays[delays.length - 1] ?? 0;
            maxTotal = Math.max(maxTotal, d + l);
          }
          if (maxTotal <= 0) {
            requestAnimationFrame(() => resolve());
            return;
          }

          let done = false;
          const onEnd = (e) => {
            if (done) return;
            if (e.target !== el) return;
            if (e.propertyName !== "transform") return;
            done = true;
            el.removeEventListener("transitionend", onEnd);
            clearTimeout(timer);
            resolve();
          };

          el.addEventListener("transitionend", onEnd);
          const timer = setTimeout(() => {
            if (done) return;
            done = true;
            el.removeEventListener("transitionend", onEnd);
            resolve();
          }, maxTotal + 80);
        });
      }

      function resetClasses() {
        topImg.className = "card top";
        underImg.className = "card under";
      }

      function setInstant(url) {
        topImg.src = url;
        underImg.src = url;
        currentUrl = url;
        resetClasses();
      }

      function setBackCard(preloadUrl) {
        topImg.src = BACK_URL;
        underImg.src = preloadUrl || BACK_URL;
        currentUrl = BACK_URL;
        resetClasses();
      }

      function preloadImage(url) {
        if (!url) return;
        const img = new Image();
        img.src = url;
      }

      function clearCards() {
        topImg.removeAttribute("src");
        underImg.removeAttribute("src");
        currentUrl = "";
        resetClasses();
      }

      async function animateNext(nextUrl, preloadNextUrl) {
        const oldUrl = currentUrl;
        currentUrl = nextUrl;

        resetClasses();
        underImg.src = nextUrl;

        void topImg.offsetWidth;
        topImg.classList.add("to-right");
        await waitTransition(topImg);

        topImg.className = "card under park-right";
        topImg.src = oldUrl;

        underImg.className = "card top";

        void topImg.offsetWidth;
        topImg.classList.remove("park-right");
        topImg.classList.add("return-center");
        await waitTransition(topImg);

        resetClasses();
        topImg.src = nextUrl;
        underImg.src = preloadNextUrl || oldUrl;
      }

      async function animatePrev(prevUrl) {
        const oldUrl = currentUrl;
        currentUrl = prevUrl;

        resetClasses();
        underImg.src = prevUrl;

        void underImg.offsetWidth;
        underImg.classList.add("under-to-right");
        await waitTransition(underImg);

        underImg.className = "card top park-right-top";
        void underImg.offsetWidth;

        underImg.classList.remove("park-right-top");
        underImg.classList.add("return-center-top");
        await waitTransition(underImg);

        resetClasses();
        topImg.src = prevUrl;
        underImg.src = oldUrl;
      }

      async function animateTo(url, delta, preloadNextUrl) {
        if (!url || url === currentUrl || animating) return;
        animating = true;
        try {
          if (delta > 0) await animateNext(url, preloadNextUrl);
          else await animatePrev(url);
        } finally {
          animating = false;
        }
      }

      allCards = await loadDeck();
      applyFilteredCards(null);
      await ensureOrderMatchesDeck();

      onSnapshot(
        roomRef,
        (snap) => {
          if (!snap.exists()) {
            setPhenomenonActive(false);
            setStatus("Room doc not found");
            return;
          }

          const data = snap.data();
          const selectedSources = Array.isArray(data.selectedSources)
            ? data.selectedSources
            : null;
          const showTextFromDoc = !!data.showText;

          applyTextMode(showTextFromDoc);

          const filterChanged = applyFilteredCards(selectedSources);
          if (filterChanged) {
            ensureOrderMatchesDeck().catch((e) => setStatus("Order repair error: " + e.message));
          }

          const forceReloadAt =
            typeof data.forceReloadAt === "number" ? data.forceReloadAt : null;
          if (lastForceReloadAt === undefined) {
            lastForceReloadAt = forceReloadAt;
          } else if (forceReloadAt !== lastForceReloadAt) {
            window.location.reload();
            return;
          }
          lastForceReloadAt = forceReloadAt;

          const order = Array.isArray(data.order) ? data.order : [];
          const idx = typeof data.idx === "number" ? data.idx : 0;

          if (!deckUrls.length) {
            setPhenomenonActive(false);
            return;
          }
          if (order.length !== deckUrls.length) {
            setPhenomenonActive(false);
            setStatus("Repairing order...");
            ensureOrderMatchesDeck().catch((e) => setStatus("Order repair error: " + e.message));
            return;
          }

          if (idx < 0) {
            setStatus("idx " + idx + " / " + order.length);
            const firstDeckIndex = order[0];
            const firstUrl =
              typeof firstDeckIndex === "number" ? deckUrls[firstDeckIndex] : null;
            preloadImage(firstUrl);
            setBackCard(firstUrl);
            renderTextCard(null);
            setPhenomenonActive(false);
            lastShownOracleId = "";
            lastIdx = idx;
            return;
          }

          const deckIndex = order[idx] ?? 0;
          const url = deckUrls[deckIndex];
          const card = filteredCards[deckIndex] || null;
          const nextDeckIndex = order[idx + 1];
          const nextLikelyUrl =
            typeof nextDeckIndex === "number" ? deckUrls[nextDeckIndex] : null;
          preloadImage(nextLikelyUrl);
          renderTextCard(card);
          const phenomenonNow = isPhenomenon(card);
          setPhenomenonActive(phenomenonNow);
          const shownOracleId =
            typeof card?.oracle_id === "string" ? card.oracle_id : "";
          if (shownOracleId !== lastShownOracleId && phenomenonNow) {
            triggerPhenomenonEffect();
          }
          lastShownOracleId = shownOracleId;

          setStatus("idx " + idx + " / " + order.length);

          if (!currentUrl) {
            setInstant(url);
            underImg.src = nextLikelyUrl || url;
            lastIdx = idx;
            return;
          }

          const deltaRaw = idx - (lastIdx ?? idx);
          lastIdx = idx;
          if (Math.abs(deltaRaw) !== 1) {
            setInstant(url);
            underImg.src = nextLikelyUrl || url;
            return;
          }

          animateTo(url, deltaRaw > 0 ? 1 : -1, nextLikelyUrl);
        },
        (err) => setStatus("Snapshot error: " + err.message),
      );
    </script>
  </body>
</html>
