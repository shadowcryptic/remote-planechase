<html>
  <head>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
      }

      .stage {
        position: relative;
      }

      .deck {
        width: 680px;
        height: 488px;
        position: relative;
        transition:
          opacity 220ms ease,
          filter 220ms ease;
      }

      .card {
        position: absolute;
        top: 50%;
        left: 50%;

        /* centered + rotated base */
        transform: translate(-50%, -50%) rotate(90deg);

        /* shrink-only (rotated => swap limits) */
        max-width: 488px;
        max-height: 680px;
        width: auto;
        height: auto;
        object-fit: contain;

        border-radius: 14px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
        user-select: none;
        -webkit-user-drag: none;
        will-change: transform;
      }

      /* resting roles */
      .top {
        z-index: 2;
        transform: translate(-50%, -50%) rotate(90deg) translateX(0)
          translateZ(0);
      }

      .under {
        z-index: 1;
        transform: translate(-50%, -50%) rotate(90deg) translateX(0)
          translateZ(0px);
      }

      /* ---------- NEXT animation ---------- */
      /* top slides out right (reveals under) */
      .top.to-right {
        transition: transform 760ms cubic-bezier(0.2, 0.8, 0.2, 1);
        transform: translate(-50%, -50%) rotate(90deg) translateX(500px)
          translateZ(0);
      }

      /* old top becomes under, parked at-right-under instantly */
      .under.park-right {
        transition: none !important;
        transform: translate(-50%, -50%) rotate(90deg) translateX(500px)
          translateZ(0px);
      }

      /* old top returns to center underneath */
      .under.return-center {
        transition: transform 1320ms cubic-bezier(0.2, 0.8, 0.2, 1);
        transform: translate(-50%, -50%) rotate(90deg) translateX(0)
          translateZ(0px);
      }

      /* ---------- PREV animation ---------- */
      /* under slides out right while staying under */
      .under.under-to-right {
        transition: transform 760ms cubic-bezier(0.2, 0.8, 0.2, 1);
        transform: translate(-50%, -50%) rotate(90deg) translateX(500px)
          translateZ(0px);
      }

      /* promote under to top at-right instantly */
      .top.park-right-top {
        transition: none !important;
        z-index: 3;
        transform: translate(-50%, -50%) rotate(90deg) translateX(500px)
          translateZ(0);
      }

      /* return on top to center */
      .top.return-center-top {
        transition: transform 820ms cubic-bezier(0.2, 0.8, 0.2, 1);
        z-index: 3;
        transform: translate(-50%, -50%) rotate(90deg) translateX(0)
          translateZ(0);
      }

      .text-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        border-radius: 16px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 220ms ease;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }

      .text-card {
        width: min(560px, 92%);
        max-height: 86%;
        overflow: auto;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.84);
        box-shadow: 0 16px 42px rgba(0, 0, 0, 0.55);
        color: rgba(255, 255, 255, 0.96);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.45;
        padding: 14px 16px;
      }

      .text-title {
        margin: 0 0 6px;
        font-size: 26px;
        font-weight: 700;
      }

      .text-type {
        margin: 0 0 10px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.72);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .text-block {
        margin: 0 0 12px;
        font-size: 18px;
        white-space: pre-line;
      }

      .text-label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.68);
        margin-bottom: 4px;
      }

      body.text-mode .deck {
        opacity: 0.25;
        filter: brightness(0.55) blur(1.6px);
      }

      body.text-mode .text-overlay {
        opacity: 1;
      }

      /* Optional debug overlay */
      #status {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 9999;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.8);
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 8px 10px;
      }

      /* If you have Reduce Motion enabled, animations will not run. */
      @media (prefers-reduced-motion: reduce) {
        .top.to-right,
        .under.return-center,
        .under.under-to-right,
        .top.return-center-top {
          transition: none !important;
        }
      }

      }
    </style>

  <body>
    <div id="status">Booting…</div>

    <div class="stage">
      <div class="deck">
        <img id="cardUnder" class="card under" alt="" />
        <img id="cardTop" class="card top" alt="" />
      </div>
      <div
        id="textOverlay"
        class="text-overlay"
        aria-live="polite"
        aria-atomic="true"
      >
        <div class="text-card">
          <h2 id="textName" class="text-title">No card</h2>
          <div id="textType" class="text-type"></div>
          <div class="text-label">Main Effect</div>
          <div id="textMain" class="text-block">-</div>
          <div class="text-label">Chaos Effect</div>
          <div id="textChaos" class="text-block">-</div>
        </div>
      </div>
    </div>

    <script type="module">
            import {
              db,
              doc,
              onSnapshot,
              runTransaction,
              serverTimestamp,
            } from "./common.js";

              const statusEl = document.getElementById("status");
              const roomRef = doc(db, "rooms", "my-room");

            const topImg = document.getElementById("cardTop");
            const underImg = document.getElementById("cardUnder");
            const textNameEl = document.getElementById("textName");
            const textTypeEl = document.getElementById("textType");
            const textMainEl = document.getElementById("textMain");
            const textChaosEl = document.getElementById("textChaos");

            let lastForceReloadAt = undefined;
            let allCards = [];
            let filteredCards = [];
            let deckUrls = [];
            let activeFilterSig = "";
            let currentUrl = "";
            let currentCard = null;
            let showText = false;
            let animating = false;
            let lastIdx = null;
            let repairInFlight = false;

            function setStatus(text) {
              statusEl.textContent = text;
            }

            async function loadDeck() {
              const res = await fetch("./deck.json", { cache: "no-store" });
              if (!res.ok) throw new Error("Failed to load deck.json");
              const data = await res.json();
              return Array.isArray(data) ? data : Array.isArray(data.deck) ? data.deck : [];
            }

            function isPlane(card) {
              const type = typeof card?.plane_type === "string" ? card.plane_type : "";
              return type.toLowerCase() === "plane";
            }

            function buildFilterSig(selectedSources) {
              const sorted = [...selectedSources].sort((a, b) => a.localeCompare(b));
              return JSON.stringify(sorted);
            }

            function getFilteredCards(selectedSources) {
              const planes = allCards.filter(isPlane);
              if (!Array.isArray(selectedSources)) {
                return planes;
              }
              if (selectedSources.length === 0) return [];
              const allowed = new Set(selectedSources);
              return planes.filter((card) => allowed.has(card.source));
            }

            function applyFilteredCards(selectedSources) {
              const normalizedSources = Array.isArray(selectedSources) ? selectedSources : null;
              const sig = normalizedSources === null ? "__ALL__" : buildFilterSig(normalizedSources);
              if (sig === activeFilterSig) return false;

              activeFilterSig = sig;
              filteredCards = getFilteredCards(normalizedSources);
              deckUrls = filteredCards.map((card) => card.image).filter(Boolean);
              currentUrl = "";
              currentCard = null;
              lastIdx = null;
              clearCards();
              renderTextCard(null);
              setStatus("Deck loaded: " + deckUrls.length + " plane cards");
              return true;
            }

            function renderTextCard(card) {
              if (!card) {
                textNameEl.textContent = "No card";
                textTypeEl.textContent = "";
                textMainEl.textContent = "-";
                textChaosEl.textContent = "-";
                return;
              }

              textNameEl.textContent = card.name || "Unnamed";
              textTypeEl.textContent = card.plane_type || "Plane";
              textMainEl.textContent = card.main_effect || "-";
              textChaosEl.textContent = card.chaos_effect || "-";
            }

            function applyTextMode(enabled) {
              showText = !!enabled;
              document.body.classList.toggle("text-mode", showText);
            }

            function shuffledIndices(n) {
              const a = [];
              for (let i = 0; i < n; i++) a.push(i);
              for (let i = n - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const tmp = a[i];
                a[i] = a[j];
                a[j] = tmp;
              }
            }

            async function ensureOrderMatchesDeck() {
              if (!deckUrls.length || repairInFlight) return;
              repairInFlight = true;
              try {
                await runTransaction(db, async (tx) => {
                  const snap = await tx.get(roomRef);
                  const existing = snap.exists() ? snap.data() : {};
                  const order = Array.isArray(existing.order) ? existing.order : [];
                  const existingFilterSig =
                    typeof existing.deckFilterSig === "string" ? existing.deckFilterSig : "";

                  if (order.length !== deckUrls.length || existingFilterSig !== activeFilterSig) {
                    tx.set(
                      roomRef,
                      {
                        order: shuffledIndices(deckUrls.length),
                        idx: -1,
                        deckFilterSig: activeFilterSig,
                        shuffledAt: serverTimestamp(),
                      },
                      { merge: true },
                    );
                  }
                });
              } finally {
                repairInFlight = false;
              }
            }

            function parseTimeListToMs(listStr) {
              // "0.32s, 120ms" -> [320,120]
              const parts = listStr.split(",").map((s) => s.trim());
              const ms = parts.map((p) => {
                if (p.endsWith("ms")) return Number(p.slice(0, -2));
                if (p.endsWith("s")) return Number(p.slice(0, -1)) * 1000;
                return Number(p) || 0;
              });
              return ms;
            }

            function waitTransition(el) {
              return new Promise((resolve) => {
                const cs = getComputedStyle(el);

                const durations = parseTimeListToMs(cs.transitionDuration);
                const delays = parseTimeListToMs(cs.transitionDelay);

                // If multiple transitions are defined, the browser pairs them by index.
                // Use the max (duration+delay) as the true upper bound.
                const n = Math.max(durations.length, delays.length, 1);
                let maxTotal = 0;
                for (let i = 0; i < n; i++) {
                  const d = durations[i] ?? durations[durations.length - 1] ?? 0;
                  const l = delays[i] ?? delays[delays.length - 1] ?? 0;
                  const total = d + l;
                  if (total > maxTotal) maxTotal = total;
                }

                // If transitions are effectively off, resolve next tick.
                if (maxTotal <= 0) {
                  requestAnimationFrame(() => resolve());
                  return;
                }

                let done = false;

                const onEnd = (e) => {
                  if (done) return;
                  if (e.target !== el) return;
                  if (e.propertyName !== "transform") return;
                  done = true;
                  el.removeEventListener("transitionend", onEnd);
                  clearTimeout(timer);
                  resolve();
                };

                el.addEventListener("transitionend", onEnd);

                // Safety timeout slightly above actual max duration
                const timer = setTimeout(() => {
                  if (done) return;
                  done = true;
                  el.removeEventListener("transitionend", onEnd);
                  resolve();
                }, maxTotal + 80);
              });
            }

            function resetClasses() {
              topImg.className = "card top";
              underImg.className = "card under";
            }

            function setInstant(url) {
              topImg.src = url;
              underImg.src = url;
              currentUrl = url;
              resetClasses();
            }

            function clearCards() {
              topImg.removeAttribute("src");
              underImg.removeAttribute("src");
              currentUrl = "";
              resetClasses();
            }

            async function animateNext(nextUrl) {
              // NEXT: current top moves right; new top never moves
              const oldUrl = currentUrl;
              currentUrl = nextUrl;

              resetClasses();
              underImg.src = nextUrl;

              // move top out
              void topImg.offsetWidth;
              topImg.classList.add("to-right");
              await waitTransition(topImg);

              // old card becomes under, parked at-right-under
              topImg.className = "card under park-right";
              topImg.src = oldUrl;

              // new top should be stable and never move
              underImg.className = "card top";

              // return old under to center
              void topImg.offsetWidth;
              topImg.classList.remove("park-right");
              topImg.classList.add("return-center");
              await waitTransition(topImg);

              // Restore fixed roles by swapping src (prevents flick)
              resetClasses();
              topImg.src = nextUrl;
              underImg.src = oldUrl;
            }

            async function animatePrev(prevUrl) {
              // PREV: current top does not move; only the under card comes onto top
              const oldUrl = currentUrl;
              currentUrl = prevUrl;

              resetClasses();
              underImg.src = prevUrl;

              // under slides out to right (still under)
              void underImg.offsetWidth;
              underImg.classList.add("under-to-right");
              await waitTransition(underImg);

              // promote to top at-right instantly...
              underImg.className = "card top park-right-top";
              void underImg.offsetWidth;

              // ...then return to center on top
              underImg.classList.remove("park-right-top");
              underImg.classList.add("return-center-top");
              await waitTransition(underImg);

              // Commit final state (top is prevUrl, under is oldUrl)
              resetClasses();
              topImg.src = prevUrl;
              underImg.src = oldUrl;
            }

            async function animateTo(url, delta) {
              if (!url || url === currentUrl || animating) return;
              animating = true;
              try {
                if (delta > 0) await animateNext(url);
                else await animatePrev(url);
              } finally {
                animating = false;
              }
            }
            // Load deck
            allCards = await loadDeck();
            applyFilteredCards(null);

            // Ensure order exists and matches deck length
            await ensureOrderMatchesDeck();

              async function loadDeck() {
                  const res = await fetch("./deck.json", { cache: "no-store" });
                  if (!res.ok) throw new Error("Failed to load deck.json");
                  const data = await res.json();
                  return Array.isArray(data.deck) ? data.deck : [];
              }

                const data = snap.data();
                const selectedSources = Array.isArray(data.selectedSources)
                  ? data.selectedSources
                  : null;
                const showTextFromDoc = !!data.showText;

                applyTextMode(showTextFromDoc);

                const filterChanged = applyFilteredCards(selectedSources);
                if (filterChanged) {
                  ensureOrderMatchesDeck().catch((e) => {
                    setStatus("Order repair error: " + e.message);
                  });
                }

                const forceReloadAt =
                  typeof data.forceReloadAt === "number" ? data.forceReloadAt : null;

      if (lastForceReloadAt === undefined) {
        // first snapshot: baseline only
        lastForceReloadAt = forceReloadAt;
      } else if (forceReloadAt !== lastForceReloadAt) {
        window.location.reload();
        return;
      }
      lastForceReloadAt = forceReloadAt;


                const order = Array.isArray(data.order) ? data.order : [];
                const idx = typeof data.idx === "number" ? data.idx : 0;

                if (!deckUrls.length) return;
                if (order.length !== deckUrls.length) {
                  setStatus("Repairing order…");
                  ensureOrderMatchesDeck().catch((e) => {
                    setStatus("Order repair error: " + e.message);
                  });
                  return;
                }
                if (idx < 0) {
                  setStatus("idx " + idx + " / " + order.length);
                  clearCards();
                  renderTextCard(null);
                  lastIdx = idx;
                  return;
                }

                const deckIndex = order[idx] ?? 0;
                const url = deckUrls[deckIndex];
                const card = filteredCards[deckIndex] || null;
                currentCard = card;
                renderTextCard(card);

              function waitTransition(el) {
                  return new Promise((resolve) => {
                      const onEnd = (e) => {
                          if (e.target !== el) return;
                          if (e.propertyName !== "transform") return;
                          el.removeEventListener("transitionend", onEnd);
                          resolve();
                      };
                      el.addEventListener("transitionend", onEnd);

                      // fallback in case transitionend doesn't fire
                      setTimeout(() => {
                          el.removeEventListener("transitionend", onEnd);
                          resolve();
                      }, 2000);
                  });
              }

              function resetClasses() {
                  topImg.className = "card top";
                  underImg.className = "card under";
              }

              function setInstant(url) {
                  topImg.src = url;
                  underImg.src = url;
                  currentUrl = url;
                  resetClasses();
              }

              async function animateNext(nextUrl) {
                  const oldUrl = currentUrl;
                  currentUrl = nextUrl;

                  // Put next card underneath and make sure it's ready BEFORE revealing
                  await setSrcAndDecode(underEl, nextUrl);

                  // Slide old top out to the right
                  normalize();
                  void topEl.offsetWidth;
                  topEl.classList.add("to-right");
                  await waitTransition(topEl);

                  // Swap element references so the NEW card becomes the permanent top element.
                  // This avoids any end-of-animation src swapping flick.
                  const oldTop = topEl;
                  topEl = underEl;
                  underEl = oldTop;

                  // New top stays centered and never moves
                  topEl.className = "card top";

                  // Old card becomes under, parked at right-under, then returns under to center
                  underEl.className = "card under park-right";
                  underEl.src = oldUrl;

                  void underEl.offsetWidth;
                  underEl.classList.remove("park-right");
                  underEl.classList.add("return-center");
                  await waitTransition(underEl);

                  // Resting state
                  underEl.className = "card under";
              }

              async function animatePrev(prevUrl) {
                  const oldUrl = currentUrl;
                  currentUrl = prevUrl;

                  // Under card will become the new top; prepare it first
                  await setSrcAndDecode(underEl, prevUrl);

                  // Top MUST NOT MOVE. Only under animates.
                  normalize();

                  // Under slides out to the right (still underneath)
                  void underEl.offsetWidth;
                  underEl.classList.add("under-to-right");
                  await waitTransition(underEl);

                  // Promote under to top at-right instantly, then return to center on top
                  underEl.className = "card top park-right-top";
                  void underEl.offsetWidth;

                  underEl.classList.remove("park-right-top");
                  underEl.classList.add("return-center-top");
                  await waitTransition(underEl);

                  // Swap references AFTER the under finished becoming top.
                  // Now the new top is permanently topEl, and the old top becomes under.
                  const oldTop = topEl;
                  topEl = underEl;
                  underEl = oldTop;

                  topEl.className = "card top";

                  underEl.className = "card under";
                  underEl.src = oldUrl;
              }

              async function animateTo(url, delta) {
                  if (!url || url === currentUrl || animating) return;
                  animating = true;
                  try {
                      if (delta > 0) await animateNext(url);
                      else await animatePrev(url);
                  } finally {
                      animating = false;
                  }
              }


              // Load deck
              deckUrls = await loadDeck();
              setStatus("Deck loaded: " + deckUrls.length);

              // Ensure order exists and matches deck length
              await runTransaction(db, async (tx) => {
                  const snap = await tx.get(roomRef);
                  const existing = snap.exists() ? snap.data() : {};
                  const order = Array.isArray(existing.order) ? existing.order : [];

                  if (deckUrls.length > 0 && order.length !== deckUrls.length) {
                      tx.set(
                          roomRef,
                          {
                              order: shuffledIndices(deckUrls.length),
                              idx: 0,
                              shuffledAt: serverTimestamp(),
                          },
                          { merge: true },
                      );
                  }
              });

              // Listen for idx changes
              onSnapshot(roomRef, (snap) => {
                  if (!snap.exists()) return;

                  const data = snap.data();
                  const order = Array.isArray(data.order) ? data.order : [];
                  const idx = typeof data.idx === "number" ? data.idx : 0;
                  const resetAt = data.resetAt ?? null;

                  if (!deckUrls.length || !order.length) return;

                  const deckIndex = order[idx] ?? 0;
                  const url = deckUrls[deckIndex];

                  // 🔴 HARD RESET DETECTED
                  if (resetAt && resetAt !== lastResetAt) {
                      lastResetAt = resetAt;

                      // Reset local state
                      revealedOnce = false;
                      lastIdx = idx;
                      currentUrl = BACK_URL;

                      // Immediately show card back
                      setInstant(BACK_URL);
                      return;
                  }

                  // 🟢 FIRST REVEAL (after reset or page load)
                  if (!revealedOnce) {
                      revealedOnce = true;
                      lastIdx = idx;
                      animateTo(url, 1); // NEXT-style reveal
                      return;
                  }

                  // 🟡 NORMAL NAVIGATION
                  const deltaRaw = idx - (lastIdx ?? idx);
                  lastIdx = idx;

                  if (Math.abs(deltaRaw) !== 1) {
                      setInstant(url);
                      return;
                  }

                  animateTo(url, deltaRaw > 0 ? 1 : -1);
              });
    </script>
  </body>
</html>
